# GoAccess config for agentty.org
# Matches the `agentty_detailed` log_format defined in agentty.org.nginx:
#   $remote_addr - $remote_user [$time_local] "$request" $status
#   $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time host=$host

log-format    %h - %e [%d:%t %^] "%r" %s %b "%R" "%u" rt=%T host=%v
date-format   %d/%b/%Y
time-format   %H:%M:%S

# Real-time WebSocket settings (used only in --live mode; the goaccess.sh
# script passes --real-time-html explicitly there). Kept here for reference.
# ws-url   wss://stats.agentty.org/ws
# port     7890
# addr     127.0.0.1

# Reporting
agent-list        true
with-mouse        true
html-report-title agentty.org analytics
tz                UTC

# Treat the install one-liner and assets as their own panels
ignore-crawlers   false
unknowns-as-crawlers true

# Persist parsed state so restarts don't lose history
persist  true
restore  true
db-path  /var/lib/goaccess
