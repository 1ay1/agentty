# agentty ccache configuration — read via `CCACHE_CONFIGPATH=$PWD/.ccache.conf`
# (see resync.sh / the CI workflow, which point ccache here).
#
# Tuned for this tree's -flto -fno-fat-lto-objects build: the object files are
# GIMPLE bytecode whose hash is otherwise sensitive to absolute paths and the
# __DATE__/__TIME__ macros, which tanks the hit rate across fresh checkouts and
# CI runners. These settings make ccache key on content the way we want.

# Generous cache: the submodule + agentty object set is large.
max_size = 5G

# Relative paths so a build in /home/you/agentty and one in CI's checkout dir
# hash identically. resync.sh/CI export CCACHE_BASEDIR to the repo root.
hash_dir = false

# Let TUs that use __DATE__/__TIME__ still hit, and don't fail over locale or
# include-file ctime/mtime jitter (a git sync rewrites mtimes even when the
# content is identical — the whole point of using ccache here).
sloppiness = locale,time_macros,include_file_ctime,include_file_mtime,pch_defines

# Keep stats so `ccache -s` after a build shows the hit rate.
stats = true
