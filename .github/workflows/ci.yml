name: ci

# Two gates:
#   1. build-test (linux gcc) — the primary gate matching the LOCAL
#      toolchain (GCC, Release): does it compile with the same compiler
#      used locally, and do the smoke tests pass. Fast + deterministic.
#   2. windows-compile (msvc) — a COMPILE-ONLY gate that mirrors the
#      release workflow's Windows configure (vcpkg static + MSVC) but
#      stops at the build; no MSI, no signing, no upload. It exists
#      because MSVC-only breakage (POSIX-only headers like <unistd.h> /
#      <ext/stdio_filebuf.h> compiled into mcp-cpp's tests/examples, which
#      agentty's standalone build pulls in) is invisible to the Linux gate
#      and used to surface only at release time (C1083). Catch it per-push.
#
# NOTE: if GitHub still shows phantom failing checks named linux-clang19,
# sanitizers (...), macos-gcc, or "fuzz harness smoke", those are REQUIRED
# STATUS CHECKS configured by NAME in the repo's branch-protection rules
# (Settings → Branches → master). No workflow in this repo produces them,
# so they hang forever. Remove those names from the required-checks list
# there — this workflow only emits the two jobs below (the windows check is
# named "windows compile (msvc)", so a required "windows-msvc" name still
# won't match; use the exact job name or drop it).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-flight run when newer commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Reclaim the cache budget ───────────────────────────────────────────
  # GitHub allows 10 GB of Actions cache PER REPO and evicts LRU across every
  # key once that's exceeded. hendrikmuhs/ccache-action writes a NEW entry per
  # run (key + timestamp) and never removes the one it just superseded, so the
  # release ccache alone had four ~1.76 GiB copies and the ASan one four more
  # — 9.70 GiB of a 10 GB budget, nearly all of it dead.
  #
  # That is self-defeating: the pressure evicts the vcpkg cache (8 minutes to
  # rebuild) and the msys2 packages, so caches that WOULD have saved time get
  # thrown out to store copies nothing will ever restore. Only the newest
  # entry per prefix is ever a restore candidate.
  #
  # Runs first, non-blocking (continue-on-error), so a hiccup in the API
  # never fails CI.
  prune-caches:
    name: prune superseded caches
    runs-on: ubuntu-latest
    permissions:
      actions: write
    continue-on-error: true
    steps:
      - name: Keep the newest entry per key prefix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Sort NEWEST-FIRST explicitly. The API does not return caches in
          # date order (verified: a 13:57 entry came back after a 12:59 one),
          # so trusting its order would keep an old entry and delete the one
          # the next run actually wants — the exact opposite of the goal.
          #
          # Then keep the first sighting of each prefix (the part before the
          # action's "-<ISO timestamp>" suffix) and delete the rest. Keys
          # without a timestamp suffix (vcpkg, msys2) are never touched.
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.created_at)\t\(.id)\t\(.key)"' \
            | sort -r \
            | while IFS="$(printf '\t')" read -r created id key; do
                prefix=$(printf '%s' "$key" | sed -E 's/-20[0-9]{2}-[0-9]{2}-[0-9]{2}T.*$//')
                [ "$prefix" = "$key" ] && continue     # no timestamp: not ours to prune
                if grep -qxF "$prefix" /tmp/seen 2>/dev/null; then
                  echo "delete superseded: $key"
                  gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true
                else
                  echo "keep newest:      $key"
                  echo "$prefix" >> /tmp/seen
                fi
              done
          echo "--- budget after prune ---"
          gh api "repos/$REPO/actions/cache/usage" \
            --jq '"\(.active_caches_count) caches, \(.active_caches_size_in_bytes/1073741824*100|floor/100) GiB"'

  build-test:
    name: build + test (linux gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Init submodules (HTTPS, race-tolerant)
        # Submodule pushes can lag GitHub replica propagation, so a fresh
        # `submodule update` may hit "not our ref / Fetched ... but it did
        # not contain <sha>". Retry a few times with a full (unshallow)
        # fetch before giving up.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive --force; then
              echo "submodules ready (attempt $attempt)"
              break
            fi
            echo "submodule update failed (attempt $attempt) — full-fetching and retrying"
            git submodule sync --recursive
            git submodule foreach --recursive 'git fetch --prune origin || true'
            sleep $((attempt * 10))
          done
          git submodule update --init --recursive --force

      - name: Install deps
        # GCC 14 for C++26 (std::expected / std::format). Mirrors the local
        # GCC toolchain; ubuntu-latest's default g++ can lag. Shared libs are
        # fine — this isn't a distributable build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build pkg-config ripgrep \
            libssl-dev libnghttp2-dev zlib1g-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-gcc14-release
          # 2G was SMALLER THAN ONE BUILD's output. The post-job report read
          # "2.0 / 2.0 GB (99.96%), Cleanups: 60" — ccache evicted itself 60
          # times while compiling, so objects written early were gone before
          # the next run could use them. Hit rate sat at 26% and the build
          # took 36m33s of a 38m49s job.
          #
          # 6G, not more, because the ceiling that actually binds is
          # GITHUB'S: 10 GB of Actions cache PER REPO, evicted LRU across
          # every key. This repo sat at 9.70 GiB — four stale copies of this
          # same ccache plus four of the ASan one — so a bigger entry would
          # have pushed out the vcpkg cache (8 min to rebuild) and the msys2
          # packages, making CI slower overall. A 30G ccache cannot even be
          # stored: the entry is dropped when it exceeds the budget, so the
          # next run starts cold every time.
          #
          # The sum of every max-size must fit in 10 GB even at worst case:
          # 6 (here) + 3 (asan) + 0.2 (msys2/vcpkg) = 9.2 GiB. In practice
          # entries track the real working set — ~530 Release TUs compress
          # to 1.76 GiB today — so the steady state is far below that, but
          # the ceiling must not be able to overflow the budget on its own.
          max-size: 6G

      - name: ccache tuning
        # LTO emits GIMPLE bytecode whose cache key is sensitive to absolute
        # paths and __TIME__/__DATE__; without these, warm-cache hit rate on a
        # fresh checkout dir craters. BASEDIR makes paths relative; the sloppy
        # flags let time-macro TUs still hit.
        run: |
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=locale,time_macros,include_file_ctime,include_file_mtime" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        # Stays Release + LTO so CI exercises the SAME optimized codegen the
        # shipped binary uses (an -O3/LTO-only miscompile must fail here, not
        # in release.yml). Speed comes from ccache: on a warm cache only the
        # changed TUs recompile, so the 39-min cold build collapses to the
        # edited delta + the final LTO link.
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAGENTTY_AUTO_PULL_MAYA=OFF \
            -DAGENTTY_USE_MIMALLOC=OFF \
            -DMAYA_NATIVE_TUNING=OFF \
            -DAGENTTY_BUILD_TESTS=ON

      - name: Build
        # tests_gating = the correctness set (agentty_tests + every standalone
        # test) MINUS the perf probes/benches, which never gate — see the
        # derived aggregate in cmake/AgenttyTestRegistry.cmake.
        run: cmake --build build -j"$(nproc)" --target all tests_gating

      - name: Test
        # -LE perf skips the perf-labelled ctest entries (e.g. long_session_bench)
        # that tests_gating deliberately didn't build.
        run: ctest --test-dir build --output-on-failure -j"$(nproc)" -LE perf

      - name: Perf regression gate
        # The long_session_bench is labelled `perf` (excluded from the gating
        # suite because timing on a shared runner is noisy). Build + run it
        # here in BENCH_ASSERT mode: it prints the numbers AND fails the job if
        # any scenario blows a generous ceiling (~6× the observed values). This
        # catches an order-of-magnitude regression — e.g. an O(n) accidentally
        # reintroduced into the per-frame path, or a lost render cache — while
        # tolerating the runner's timing jitter. Not a hard microbenchmark.
        run: |
          cmake --build build -j"$(nproc)" --target agentty_standalone_tests
          BENCH_ASSERT=1 ./build/agentty_standalone_tests long_session_bench

  # Rust-grade memory-safety gate. Builds agentty's OWN-logic test set under
  # -fsanitize=address,undefined and runs it: proves those paths are free of
  # use-after-free / buffer overflow / leaks / UB at RUNTIME, complementing the
  # compile-time static_assert proofs. Scoped to the `sanitizer`-labelled
  # tests (crypto/creds, FSM, tool-arg repair, skills, fuzzy match, and the
  # concurrency primitives) because they don't link maya's prebuilt,
  # un-instrumented renderer (which would ODR-clash). LTO is off for speed +
  # readable traces; the constexpr catalog proofs auto-skip under
  # AGENTTY_SANITIZER_BUILD (they already ran green in the build-test job).
  sanitizers:
    name: sanitizers (asan+ubsan, tsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Init submodules (HTTPS, race-tolerant)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive --force; then
              echo "submodules ready (attempt $attempt)"
              break
            fi
            echo "submodule update failed (attempt $attempt) — full-fetching and retrying"
            git submodule sync --recursive
            git submodule foreach --recursive 'git fetch --prune origin || true'
            sleep $((attempt * 10))
          done
          git submodule update --init --recursive --force
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build pkg-config ripgrep \
            libssl-dev libnghttp2-dev zlib1g-dev
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-gcc14-asan-ubsan
          # 600M held LESS THAN ONE BUILD: "0.6 / 0.6 GB (97.97%), Cleanups:
          # 321" with a 5.47% hit rate — the cache evicted itself 321 times
          # and then missed on 415 of 439 compiles. It was pure overhead:
          # paying upload/download for something that never hit.
          #
          # Sanitizer objects are bigger than release ones (instrumentation
          # + full debug info), which is exactly why 600M never stood a
          # chance. 3G covers a full ASan build and the TSan tree that
          # follows it in the same job, and fits the 10 GB repo budget
          # alongside the release cache now that prune-caches drops
          # superseded copies.
          max-size: 3G
      - name: Configure (ASan + UBSan)
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build-san -GNinja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAGENTTY_AUTO_PULL_MAYA=OFF \
            -DAGENTTY_USE_MIMALLOC=OFF \
            -DMAYA_NATIVE_TUNING=OFF \
            -DAGENTTY_BUILD_TESTS=ON \
            -DAGENTTY_SANITIZE_ALL=address,undefined
      - name: Build sanitizer test set
        run: cmake --build build-san -j"$(nproc)" --target sanitizer_tests
      - name: Run under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san -L sanitizer --output-on-failure -j"$(nproc)"

      # ── ThreadSanitizer ────────────────────────────────────────────────
      # A SEPARATE tree because TSan cannot be combined with ASan in one
      # binary. Scoped to the `race`-labelled tests, which are written to
      # drive the shared seams from many threads at once so TSan has
      # interleavings to find.
      #
      # This lane exists because asan+ubsan above cannot see a data race, and
      # every concurrency bug this project has shipped was a race or a
      # lifetime error between threads: a shared_ptr cycle that made a worker
      # destroy its own queue and join itself, a worker left joinable in a
      # function-local static (terminate at exit), and N threads racing to
      # publish into one map. All three passed the ASan lane.
      - name: Configure TSan tree
        # Same compiler as the ASan tree above. Without this the step falls
        # back to the runner's DEFAULT gcc (13), which does not implement
        # deducing `this` (P0847) — so maya's type-state Terminal fails to
        # parse and the whole lane dies at maya/src/app/app.cpp with
        # "expected identifier before 'this'". The ASan configure has always
        # set this; the TSan one was missed, so the lane only ever built
        # when the runner image happened to default to a new enough gcc.
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build-tsan -GNinja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAGENTTY_AUTO_PULL_MAYA=OFF \
            -DAGENTTY_USE_MIMALLOC=OFF \
            -DMAYA_NATIVE_TUNING=OFF \
            -DAGENTTY_BUILD_TESTS=ON \
            -DAGENTTY_SANITIZE_ALL=thread
      - name: Build race test set
        run: |
          cmake --build build-tsan -j"$(nproc)" --target race_harness_test
          cmake --build build-tsan -j"$(nproc)" --target agentty_standalone_tests
      - name: Run under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan -L race --output-on-failure -j"$(nproc)"

  # Compile-only Windows gate. Mirrors release.yml's build-windows configure
  # (vcpkg static openssl+nghttp2, MSVC, Release) but stops at the build:
  # no MSI, no signing, no upload. Purpose is narrow but important — prove
  # the tree still COMPILES under MSVC so a POSIX-only header or API sneaking
  # into a TU that Windows builds (notably mcp-cpp's tests/examples, which
  # agentty's standalone build pulls in) is caught here on every push instead
  # of blowing up the Windows release leg with C1083 ~19 min into a release.
  windows-compile:
    name: windows compile (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Init submodules (HTTPS, race-tolerant)
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive --force; then break; fi
            echo "submodule update failed (attempt $attempt) — full-fetching and retrying"
            git submodule sync --recursive
            git submodule foreach --recursive 'git fetch --prune origin || true'
            sleep $((attempt * 10))
          done
          git submodule update --init --recursive --force
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-static-openssl-nghttp2-v1
          restore-keys: vcpkg-x64-windows-static-
      - name: Install deps (vcpkg static)
        shell: pwsh
        env:
          # Reuse cached .zip package archives; only rebuild on a cache miss.
          VCPKG_BINARY_SOURCES: "clear;files,C:\\Users\\runneradmin\\AppData\\Local\\vcpkg\\archives,readwrite"
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin master
          git -C "$env:VCPKG_INSTALLATION_ROOT" reset --hard FETCH_HEAD
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl nghttp2 --triplet x64-windows-static
      - name: Configure + build (compile only)
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DAGENTTY_STANDALONE=ON -DAGENTTY_AUTO_PULL_MAYA=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release -j

  # MinGW / MSYS2 ucrt64 gate. This is the toolchain real Windows users build
  # under, and CRUCIALLY it is the ONLY Windows path that actually COMPILES the
  # rag-cpp retrieval engine and the acp-cpp FdTransport (both are gated OFF on
  # MSVC). A POSIX-ism leaking into those — e.g. rag-cpp's store fsync/kill, or
  # acp-cpp's stdio writev — is invisible to the MSVC gate above and only shows
  # up here. Compile-only; the CPU retrieval path is exercised, no GPU backend.
  windows-mingw:
    name: windows compile (msys2 ucrt64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Init submodules (HTTPS, race-tolerant)
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive --force; then break; fi
            git submodule sync --recursive
            git submodule foreach --recursive 'git fetch --prune origin || true'
            sleep $((attempt * 10))
          done
          git submodule update --init --recursive --force
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-nghttp2
            git
      - name: ccache dir
        uses: actions/cache@v4
        with:
          path: D:\a\_temp\msys64\home\runneradmin\.ccache
          key: windows-mingw-ucrt64-ccache-${{ github.sha }}
          restore-keys: windows-mingw-ucrt64-ccache-
      - name: Configure + build (compile only)
        run: |
          export CCACHE_MAXSIZE=2G
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAGENTTY_STANDALONE=ON -DAGENTTY_AUTO_PULL_MAYA=OFF
          cmake --build build -j
          ccache -s

      # Runtime smoke test. Compile-only cannot catch MSYS2/mintty's runtime
      # path: mintty gives a native executable PIPE-backed stdio handles, not
      # Win32 console handles. Exercise that exact HANDLE type with cmd.exe's
      # `type NUL | agentty.exe`: unlike MSYS bash's /dev/null (a NUL character
      # device, NOT a pipe) and its unreliable PE exit-status bookkeeping, cmd
      # creates an anonymous pipe and reports the native process exit code.
      - name: Runtime smoke test (native pipe, mintty-like)
        timeout-minutes: 2
        shell: pwsh
        env:
          # setup-msys2 installs the UCRT runtime below RUNNER_TEMP. A pwsh
          # step needs it explicitly for libstdc++/libgcc/nghttp2 DLL lookup.
          UCRT64_BIN: ${{ runner.temp }}\msys64\ucrt64\bin
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:UCRT64_BIN;$env:Path"
          $env:COLUMNS = '80'
          $env:LINES = '24'
          $bin = (Resolve-Path 'build/agentty.exe').Path
          Write-Host "binary: $bin"
          & $bin --version
          if ($LASTEXITCODE -ne 0) {
            throw "--version failed with exit $LASTEXITCODE"
          }

          # `type NUL` writes zero bytes then closes its pipe end. agentty must
          # select its pipe-terminal implementation, observe EOF/hangup, and
          # exit normally — no hidden console, MSYS shell shim, or NUL device.
          $cmd = 'type NUL | "' + $bin + '"'
          & cmd.exe /d /s /c $cmd 1>smoke.out 2>smoke.err
          $rc = $LASTEXITCODE
          Write-Host "exit=$rc"
          Write-Host '----- stdout (head) -----'
          if (Test-Path smoke.out) { Get-Content smoke.out -TotalCount 50 }
          Write-Host '----- stderr -----'
          if (Test-Path smoke.err) { Get-Content smoke.err }
          if ($rc -ne 0) {
            Write-Error "agentty exited non-zero ($rc) on a native pipe stdin"
            exit 1
          }
          Write-Host 'smoke test passed: launched and exited cleanly under a native pipe'

  # Bounded fuzz smoke of the mcp-cpp harnesses (fuzz/). libFuzzer needs Clang,
  # which ubuntu-latest doesn't ship by default; the harnesses double as a
  # deterministic GCC + ASan/UBSan driver (fuzz_<name>_driver.cpp), so we run
  # that here — same crash coverage on the reachable-from-a-tool locators
  # (edit/apply_patch fuzzy match) without a Clang toolchain. Fast: a few k
  # iterations + the hand-picked edge cases, seconds of runtime. Satisfies the
  # "fuzz harness smoke" required status check.
  fuzz-smoke:
    name: fuzz harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Init submodules (HTTPS, race-tolerant)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --recursive --force; then break; fi
            sleep $((attempt * 10))
          done
          git submodule update --init --recursive --force
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build
      - name: Configure fuzz harnesses (GCC asan+ubsan driver)
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S mcp-cpp -B fuzzbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMCP_BUILD_FUZZERS=ON \
            -DMCP_BUILD_TESTS=OFF \
            -DMCP_BUILD_EXAMPLES=OFF
      - name: Build fuzz harnesses
        run: cmake --build fuzzbuild -j"$(nproc)"
      - name: Run bounded fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # Edge cases + a bounded random burst per harness; a crash/UB aborts
          # the job non-zero.
          ./fuzzbuild/fuzz/fuzz_fuzzy_match 5000
          ./fuzzbuild/fuzz/fuzz_apply_patch 20000

